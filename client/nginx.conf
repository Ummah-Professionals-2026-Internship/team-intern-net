server {
    listen 80;
    server_name teaminternnet.ddns.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name teaminternnet.ddns.net;

    ssl_certificate /etc/letsencrypt/live/teaminternnet.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teaminternnet.ddns.net/privkey.pem;

    # Backend routes
    location ~ ^/(auth|intake|mentor|matching|google|dashboard|docs|openapi.json|redoc) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend - everything else
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}